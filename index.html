		function openBlobStore(){return new Promise(resolve=>{if(!window.indexedDB){resolve(null);return}const request=indexedDB.open('northstar-file-blobs',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null)})}
		async function saveFileBlob(id,blob){blobCache.set(id,blob);const db=await openBlobStore();if(!db)return;await new Promise(resolve=>{const transaction=db.transaction('files','readwrite');transaction.objectStore('files').put(blob,id);transaction.oncomplete=resolve;transaction.onerror=resolve})}
		async function loadFileBlob(id){if(blobCache.has(id))return blobCache.get(id);const db=await openBlobStore();if(!db)return null;return new Promise(resolve=>{const request=db.transaction('files','readonly').objectStore('files').get(id);request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>resolve(null)})}
		const safeLoad=(key,fallback)=>{try{const value=JSON.parse(localStorage.getItem(key));return value??fallback}catch{return fallback}};
		const state={files:safeLoad('northstar-files',seedFiles),activity:safeLoad('northstar-activity',seedActivity),team:safeLoad('northstar-team',teamSeed),view:'overview',folder:'',search:'',filter:'all',settings:{linkExpiry:true,downloadControl:true,notify:true,...safeLoad('northstar-settings',{})}};

		const escapeHtml=(value)=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

		function fileIcon(file){const kind=file.type==='folder'?'folder':file.type==='pdf'?'pdf':file.type==='sheet'?'sheet':file.type==='image'?'image':'';return `<span class="file-icon ${kind}">${icon(file.type==='folder'?'folder':'file')}</span>`}

		function fileActions(file){return `${isFolder(file)?'':`<button class="icon-button" data-action="download" data-id="${file.id}" title="Download file" aria-label="Download ${displayName(file)}">${icon('download')}</button>`}<button class="icon-button" data-action="star" data-id="${file.id}" title="${file.starred?'Remove from starred':'Add to starred'}" aria-label="${file.starred?'Remove from starred':'Add to starred'}">${icon('star')}</button><button class="icon-button" data-action="more" data-id="${file.id}" title="More options" aria-label="More options">${icon('more')}</button>`}
		function fileRow(file,compact=false){const main=`<span class="table-name">${fileIcon(file)}<span class="file-text"><strong>${displayName(file)}</strong><small>${isFolder(file)?'Folder':escapeHtml(file.owner)}</small></span></span>`;

		function renderOverview(){const files=visibleFiles().slice(0,5);return `${pageHeader('Good morning, Ameen','Your team is moving things forward.',`<button class="btn" data-action="invite">${icon('plus')} Invite people</button><button class="btn btn-primary" data-action="upload">${icon('upload')} Upload files</button>`)}<div class="hero-band"><div class="hero-copy"><div class="hero-kicker">MONDAY, OCTOBER 21</div><h2>Everything your team needs, in one place.</h2><p>Your workspace is up to date. Pick up right where you left off.</p></div><div class="hero-right"><div class="secure-pill">${icon('lock')} Encrypted workspace</div>${avatars()}</div></div><div class="stat-grid"><div class="stat-card"><div class="stat-label">${icon('folder')} Total files</div><div class="stat-value">${state.files.filter(f=>!f.trashed&&!isFolder(f)).length}<span class="stat-meta">in your workspace</span></div></div><div class="stat-card"><div class="stat-label">${icon('share')} Shared with team</div><div class="stat-value">${state.files.filter(f=>f.shared&&!f.trashed).length}<span class="stat-meta">items</span></div></div><div class="stat-card"><div class="stat-label">${icon('pulse')} Active today</div><div class="stat-value">${Math.max(4,state.activity.length)}<span class="stat-meta">team updates</span></div></div><div class="stat-card"><div class="stat-label">${icon('shield')} Workspace health</div><div class="stat-value" style="font-size:17px;color:var(--green)">Protected<span class="stat-meta">all systems normal</span></div></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Recently updated</h2><button class="text-link" data-view="files">Browse all files <span aria-hidden="true">→</span></button></div>${files.map(f=>fileRow(f,true)).join('')||'<div class="empty-state">No recent files.</div>'}</section><section class="panel"><div class="panel-head"><h2>Team activity</h2><button class="text-link" data-view="activity">View all</button></div><div class="activity-list">${state.activity.slice(0,4).map(activityItem).join('')}</div></section></div><div class="quick-row"><button class="quick-action" data-action="new-folder"><span class="quick-icon">${icon('folder')}</span><span><strong>New folder</strong><small>Organize your files</small></span></button><button class="quick-action" data-action="invite"><span class="quick-icon">${icon('plus')}</span><span><strong>Invite a teammate</strong><small>Bring your team together</small></span></button><button class="quick-action" data-view="shared"><span class="quick-icon">${icon('share')}</span><span><strong>Review shared files</strong><small>Keep access up to date</small></span></button></div>`}
		function renderFiles(){const files=visibleFiles();const folder=state.files.find(f=>f.id===state.folder);const crumb=state.folder?`<div class="crumbs"><button data-view="files" data-folder="">All files</button><span>›</span><span>${escapeHtml(folder?.name||'Folder')}</span></div>`:'';return `${pageHeader(state.view==='files'?'All files':state.view==='shared'?'Shared with me':state.view==='starred'?'Starred':'Trash',state.view==='files'?'Everything your team has stored, organized in one place.':state.view==='shared'?'Files and folders your team has shared with you.':state.view==='starred'?'Your quick-access files and folders.':'Items in trash are removed after 30 days.',`<button class="btn" data-action="new-folder">${icon('plus')} New folder</button><button class="btn btn-primary" data-action="upload">${icon('upload')} Upload</button>`)}${crumb}<div class="panel"><div class="toolbar"><select id="file-filter" aria-label="Filter files"><option value="all">All items</option><option value="folders">Folders</option><option value="documents">Documents</option></select><span class="toolbar-spacer"></span><span style="font-size:10px;color:#89948d">${files.length} ${files.length===1?'item':'items'}</span></div>${table(files)}</div>`}
		function renderActivity(){return `${pageHeader('Activity','A running record of what your team is working on.')}<div class="activity-page-grid"><section class="panel"><div class="panel-head"><h2>Team timeline</h2><span class="tag">All activity</span></div><div class="timeline-date">Today</div>${state.activity.map((item,index)=>`<div class="timeline-entry">${activityItem(item).replace('activity-item','activity-item').replace('activity-list','activity-list')}<time>${escapeHtml(item.time)}</time></div>`).join('')}<div class="timeline-date">Workspace history</div><div class="timeline-entry"><span class="activity-avatar">AM</span><div class="activity-copy"><strong>Northstar Studio</strong> workspace secured with team access controls.<small>Workspace created</small></div><time>Oct 1</time></div></section><section class="panel"><div class="panel-head"><h2>Workspace snapshot</h2></div><div class="activity-list"><div class="activity-item"><span class="quick-icon">${icon('folder')}</span><div class="activity-copy"><strong>${state.files.filter(f=>!f.trashed&&!isFolder(f)).length} files</strong><small>Across your workspace</small></div></div><div class="activity-item"><span class="quick-icon">${icon('share')}</span><div class="activity-copy"><strong>${state.team.length+1} collaborators</strong><small>With access to this workspace</small></div></div></div></section></div>`}

		function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.getElementById('toast-region').append(el);setTimeout(()=>el.remove(),2800)}
		function logActivity(action,target){state.activity.unshift({initials:'AM',name:'You',action,target,time:'Just now',type:action});persist()}
		function openDialog(title,subtitle,body,submitLabel,onSubmit){const root=document.getElementById('modal-root');root.innerHTML=`<div class="overlay" data-close-overlay><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><div><h2 id="dialog-title">${escapeHtml(title)}</h2><p>${escapeHtml(subtitle)}</p></div><button class="icon-button" data-close aria-label="Close">×</button></div><form id="dialog-form"><div class="dialog-body">${body}</div><div class="dialog-foot"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn btn-primary">${escapeHtml(submitLabel)}</button></div></form></section></div>`;root.querySelector('[data-close]').focus();root.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',closeDialog));root.querySelector('.overlay').addEventListener('click',event=>{if(event.target===event.currentTarget)closeDialog()});root.querySelector('#dialog-form').addEventListener('submit',event=>{event.preventDefault();onSubmit(new FormData(event.currentTarget))});root.addEventListener('keydown',dialogKeys,{once:true})}
		function dialogKeys(event){if(event.key==='Escape')closeDialog()}
		function closeDialog(){document.getElementById('modal-root').innerHTML=''}
		function openInvite(){openDialog('Invite your team','Bring the right people into Northstar Studio.',`<div class="field"><label for="invite-email">Work email</label><input id="invite-email" name="email" type="email" placeholder="name@company.com" required></div><div class="field"><label for="invite-role">Workspace role</label><select id="invite-role" name="role"><option>Editor</option><option>Viewer</option></select><span class="field-help">Editors can upload, edit, and share files.</span></div>`,`Send invite`,form=>{const email=String(form.get('email')).trim();if(!email)return;const name=email.split('@')[0].replace(/[._-]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());const initials=name.split(' ').map(part=>part[0]).join('').slice(0,2).toUpperCase();state.team.push({name,initials,color:'a3'});persist();renderTeam();closeDialog();toast(`Invitation sent to ${email}`);logActivity('invited',email)})}
		function openNewFolder(){openDialog('Create a folder','Give your team a clear place to work.',`<div class="field"><label for="folder-name">Folder name</label><input id="folder-name" name="name" placeholder="e.g. Design review" maxlength="80" required></div><div class="field"><label for="folder-access">Access</label><select name="access" id="folder-access"><option value="team">Everyone in Northstar Studio</option><option value="private">Just me</option></select></div>`,`Create folder`,form=>{const name=String(form.get('name')).trim();if(!name)return;state.files.unshift({id:crypto.randomUUID(),name,type:'folder',size:'0 items',owner:'Ameen Malik',updated:'Just now',folder:state.folder,shared:form.get('access')==='team',starred:false,comments:[]});persist();closeDialog();render();toast('Folder created');logActivity('created folder',name)})}
		function openShare(file){const token=crypto.randomUUID().replaceAll('-','').slice(0,16);const url=`https://northstar.example/share/${token}`;openDialog('Share file',file.name,`<div class="field"><label for="share-email">Invite by email</label><div class="share-link"><input id="share-email" type="email" placeholder="name@company.com"><button type="button" class="btn" data-action="share-invite">Invite</button></div></div><div class="field"><label for="share-permission">Anyone with the link can</label><select id="share-permission"><option>View</option><option>Comment</option><option>Edit</option></select></div><div class="field"><label>Share link</label><div class="share-link"><input id="share-url" readonly value="${url}"><button type="button" class="btn" data-action="copy-link">Copy link</button></div></div><div class="permission-note">${icon('lock')} Link access is a demo preview only. No real permissions or server-side security are enforced.</div>`,`Done`,()=>{file.shared=true;persist();closeDialog();render();toast('Sharing settings updated')});document.getElementById('modal-root').querySelector('[data-action="copy-link"]').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(url);toast('Share link copied')}catch{document.getElementById('share-url').select();document.execCommand('copy');toast('Share link copied')}});document.getElementById('modal-root').querySelector('[data-action="share-invite"]').addEventListener('click',()=>{const email=document.getElementById('share-email').value;if(!email){document.getElementById('share-email').focus();return}toast(`Invite prepared for ${email}`);document.getElementById('share-email').value=''})}
		function openComments(file){const comments=file.comments||[];const body=`<div class="comment-list">${comments.length?comments.map(comment=>`<div class="comment"><strong>${escapeHtml(comment.author)}</strong><time>${escapeHtml(comment.time)}</time><div>${escapeHtml(comment.text)}</div></div>`).join(''):'<div class="empty-state" style="padding:20px 0">No comments yet. Start the conversation.</div>'}</div><div class="field" style="margin-top:15px"><label for="comment-text">Add a comment</label><textarea name="comment" id="comment-text" placeholder="Share an update with your team..." required></textarea></div>`;openDialog('Discussion',file.name,body,'Post comment',form=>{const text=String(form.get('comment')).trim();if(!text)return;file.comments=file.comments||[];file.comments.push({author:'Ameen Malik',text,time:`Today, ${relativeDate()}`});file.updated='Just now';persist();logActivity('commented on',file.name);closeDialog();render();toast('Comment added')})}
		function runUpload(){document.getElementById('upload-input').click()}
		function formatSize(bytes){if(bytes<1024)return `${bytes} B`;if(bytes<1048576)return `${(bytes/1024).toFixed(0)} KB`;return `${(bytes/1048576).toFixed(1)} MB`}
		async function acceptFiles(list){if(!list?.length)return;for(const upload of list){const ext=upload.name.split('.').pop().toLowerCase();const type=ext==='pdf'?'pdf':['xlsx','csv'].includes(ext)?'sheet':['png','jpg','jpeg','webp','gif'].includes(ext)?'image':ext==='fig'?'fig':'doc';const id=crypto.randomUUID();state.files.unshift({id,name:upload.name,type,size:formatSize(upload.size),owner:'Ameen Malik',updated:'Just now',folder:state.view==='files'?state.folder:'',shared:false,starred:false,comments:[],hasBlob:true});await saveFileBlob(id,upload);logActivity('uploaded',upload.name)}persist();render();toast(`${list.length} ${list.length===1?'file':'files'} added to this browser workspace`)}
		async function downloadFile(id){const file=state.files.find(item=>item.id===id);if(!file||isFolder(file))return;let blob=await loadFileBlob(id);let filename=file.name;if(!blob){const contents=`Northstar Studio demo file\n\nName: ${file.name}\nOwner: ${file.owner}\nLast updated: ${file.updated}\nSize: ${file.size}\n\nThis is a sample workspace item. Its original file contents were not included in this single-file demo.`;blob=new Blob([contents],{type:'text/plain'});filename=`${file.name.replace(/\.[^.]+$/,'')} - demo note.txt`;toast('Sample item downloaded as a note; original file contents are not included.')}const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
		function actOnFile(action,id){const file=state.files.find(item=>item.id===id);if(!file)return;if(action==='download'){downloadFile(id);return}if(action==='star'){file.starred=!file.starred;persist();render();toast(file.starred?'Added to starred':'Removed from starred');return}if(action==='more'){const choices=file.trashed?['Restore','Delete permanently']:['Download','Share','Comments',file.shared?'Make private':'Move to trash'];openDialog(file.name,'Choose an action for this item.',`<div style="display:grid;gap:7px">${choices.map((label,index)=>`<button type="button" class="btn" style="justify-content:flex-start" data-menu-action="${index}">${label}</button>`).join('')}</div>`,'Close',closeDialog);document.querySelectorAll('[data-menu-action]').forEach((button,index)=>button.addEventListener('click',()=>{closeDialog();const selected=choices[index];if(selected==='Download')downloadFile(id);else if(selected==='Share')openShare(file);else if(selected==='Comments')openComments(file);else if(selected==='Restore'){file.trashed=false;persist();render();toast('Item restored')}else if(selected==='Delete permanently'){state.files=state.files.filter(item=>item!==file);persist();render();toast('Item permanently deleted')}else if(selected==='Move to trash'){file.trashed=true;persist();render();toast('Moved to trash')}}));return}}
		function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('mobile-backdrop').classList.add('show')}
		function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobile-backdrop').classList.remove('show')}
		document.getElementById('main-nav').addEventListener('click',event=>{const link=event.target.closest('[data-view]');if(link)setView(link.dataset.view)});
		document.getElementById('view-container').addEventListener('click',event=>{
			const viewButton=event.target.closest('[data-view]');if(viewButton){setView(viewButton.dataset.view,viewButton.dataset.folder||'');return}
			const openFolder=event.target.closest('[data-open-folder]');if(openFolder){setView('files',openFolder.dataset.openFolder);return}
			const actionButton=event.target.closest('[data-action]');if(!actionButton)return;const action=actionButton.dataset.action;
			if(action==='upload')runUpload();else if(action==='new-folder')openNewFolder();else if(action==='invite')openInvite();else if(action==='star'||action==='more'||action==='download')actOnFile(action,actionButton.dataset.id);else if(action==='share')openShare(state.files.find(file=>file.id===actionButton.dataset.id));else if(action==='comments')openComments(state.files.find(file=>file.id===actionButton.dataset.id));else if(action==='security-settings')setView('settings');else if(action==='profile-info')openDialog('Your profile','Workspace owner details.',`<div class="setting-row"><div><strong>Ameen Malik</strong><small>ameen@northstar.studio</small></div><span class="tag">Owner</span></div>`,'Done',closeDialog);else if(action==='team-settings')openDialog('Team members',`${state.team.length+1} people have workspace access.`,state.team.map(person=>`<div class="team-person"><span class="avatar ${person.color||''}">${escapeHtml(person.initials)}</span><span>${escapeHtml(person.name)}</span><span class="person-status"></span></div>`).join('')+`<div class="team-person"><span class="profile-avatar">AM</span><span>Ameen Malik</span><span class="tag">Owner</span></div>`,'Invite people',()=>{closeDialog();openInvite()});else if(action==='storage-info')openDialog('Workspace storage','Storage usage in this browser demo.',`<div class="storage-box"><div class="storage-top"><span>Used storage</span><span>3.8 / 10 GB</span></div><div class="storage-track"><span></span></div><div class="storage-foot">Uploaded file contents are kept in this browser only.</div></div>`,'Done',closeDialog)
		});
		document.getElementById('view-container').addEventListener('change',event=>{if(event.target.id==='file-filter'){state.filter=event.target.value;render()}});
		document.getElementById('upload-input').addEventListener('change',event=>{acceptFiles(event.target.files);event.target.value=''});
		document.getElementById('invite-team').addEventListener('click',openInvite);
		document.getElementById('open-settings').addEventListener('click',()=>setView('settings'));
		document.getElementById('top-profile').addEventListener('click',()=>setView('settings'));
		document.getElementById('workspace-switch').addEventListener('click',()=>toast('You are in Northstar Studio'));
		document.getElementById('notifications').addEventListener('click',()=>{openDialog('Notifications','Recent updates from your workspace.',state.activity.slice(0,4).map(item=>`<div class="activity-item"><span class="activity-avatar ${item.color||''}">${escapeHtml(item.initials)}</span><div class="activity-copy"><strong>${escapeHtml(item.name)}</strong> ${escapeHtml(item.action)} <strong>${escapeHtml(item.target)}</strong><small>${escapeHtml(item.time)}</small></div></div>`).join('')||'<div class="empty-state">You’re all caught up.</div>','Done',closeDialog)});
		document.getElementById('mobile-menu').addEventListener('click',openSidebar);
		document.getElementById('mobile-backdrop').addEventListener('click',closeSidebar);
		document.getElementById('global-search').addEventListener('input',event=>{state.search=event.target.value.trim();if(state.search){state.view='search';render()}else if(state.view==='search'){state.view='overview';render()}});
		document.getElementById('global-search').addEventListener('keydown',event=>{if(event.key==='Enter'&&state.search){state.view='search';render()}if(event.key==='Escape'){event.target.value='';state.search='';if(state.view==='search')setView('overview')}});
		document.getElementById('view-container').addEventListener('click',event=>{const toggle=event.target.closest('[data-setting]');if(toggle){const key=toggle.dataset.setting;state.settings[key]=!state.settings[key];persist();render()}});
		document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();document.getElementById('global-search').focus()}if(event.key==='Escape'){closeDialog();closeSidebar()}});
		renderTeam();render();
	</script>
</body>
</html>
